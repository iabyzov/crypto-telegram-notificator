apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-checker
  namespace: crypto-bot
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: alert-checker
            image: curlimages/curl:latest
            command:
            - curl
            - -sf
            - http://crypto-bot:8000/check-alerts
